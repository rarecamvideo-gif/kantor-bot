<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kantor Bot Cendi</title>
<style>body{margin:0;background:#0f1330;color:#eef0ff;font-family:system-ui,sans-serif;padding:12px}.box{max-width:620px;margin:0 auto}h1{font-size:24px;margin:4px 0}#st{color:#9ff5b3;font-size:15px;margin-bottom:10px}
#sk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}#sk button{font-size:15px;padding:8px 14px;border-radius:20px;border:1px solid #3a4380;background:#1a2050;color:#eef0ff}#sk button.on{background:#eef0ff;color:#111}
#wrap{position:relative}canvas{width:100%;display:block;image-rendering:pixelated;border-radius:12px}.lbl{position:absolute;font:12px monospace;color:#cfd6ff}
.tag{position:absolute;transform:translate(-50%,-100%);max-width:48%;background:rgba(14,18,44,.88);color:#fff;border-left:4px solid;border-radius:6px;padding:3px 8px;line-height:17px;cursor:pointer}.tag.on{background:#fff;color:#111}.tag .n{font-size:14px;font-weight:700;white-space:nowrap}.tag .s{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit{position:absolute;width:50%;cursor:pointer}#det{display:none;background:#1a2050;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:15px;line-height:23px;word-break:break-word}#det .n{font-size:18px;font-weight:600}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:14px}td,th{border-bottom:1px solid #2a3360;padding:6px;text-align:left}</style></head><body><div class="box">
<h1>Kantor Bot Cendi</h1><div id="st">Memuat status…</div><div id="sk"></div>
<div id="wrap"><canvas id="c" width="320" height="520"></canvas><div class="lbl" style="left:1%;top:1.2%">heavy-cpu</div><div class="lbl" style="right:1.5%;top:1.2%">vectorizer.ai</div><div class="lbl" style="left:4%;bottom:1.5%;color:#fff">pojok kopi</div></div>
<div id="det"></div><table><thead><tr><th>Bot</th><th>Level</th><th>Keterangan</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const LOOK = {
  sup: { shirt: "#2d3a6b", hair: "#3b2416", skin: "#f1c7a0", fur: "#e0a050", wall: "#5b4a7a", acc: "tie" },
  fi: { shirt: "#3a9ad9", hair: "#1c1c1c", skin: "#e9b98d", fur: "#9a9a9a", wall: "#35567a", acc: "beret" },
  fv: { shirt: "#3fae5a", hair: "#a0522d", skin: "#f5d0b0", fur: "#f3f3f3", wall: "#2f5e4e", acc: "phones" },
  png: { shirt: "#e86a8c", hair: "#f2d16b", skin: "#f7d7bf", fur: "#d98c4a", wall: "#6e3f55", acc: "camera" },
  ans: { shirt: "#d94040", hair: "#2b1a10", skin: "#c68a5e", fur: "#333333", wall: "#6a3434", acc: "cap" },
  ni: { shirt: "#8a5fd1", hair: "#121212", skin: "#d9a477", fur: "#b07a3a", wall: "#45366e", acc: "glasses" },
  sv: { shirt: "#f08a24", hair: "#5a3a22", skin: "#e8b48a", fur: "#e8e0d0", wall: "#6b4a26", acc: "clap" },
  oi: { shirt: "#4bbdb5", hair: "#c94f3a", skin: "#f3cfae", fur: "#5a5a5a", wall: "#2c5b5e", acc: "beanie" },
};
const LV = { ngebut: { label: "Ngebut", dot: "#ff7a3d" }, sibuk: { label: "Sibuk", dot: "#58e07a" }, santai: { label: "Santai", dot: "#f2c94c" }, tidur: { label: "Tidur", dot: "#8a93b8" } };
let HEAVY=false,VZ=null;
const CW = 320, CH = 520, TOP = 70, ROWH = 95;
const cellOf = (i) => [(i % 2) * 160, TOP + Math.floor(i / 2) * ROWH];
function drawBg(g, t) {
  const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  r(0, 0, CW, 62, "#4a4f7a"); r(0, 58, CW, 4, "#00000033");
  for (let x = 0; x < CW; x += 16) for (let y = 62; y < CH; y += 8) r(x + ((y / 8) % 2) * 8, y, 15, 7, (x + y) % 32 ? "#b8925f" : "#ad8655");
  r(150, 70, 20, 380, "#8a3b3b55");
  [70, 130, 190].forEach((wx, k) => {
    r(wx, 8, 44, 34, "#3a2a1a"); r(wx + 2, 10, 40, 30, "#141a3d");
    for (let i = 0; i < 5; i++) if (Math.sin(t / 600 + i * 7 + k) > -0.2) r(wx + 4 + (i * 13 + k * 5) % 34, 12 + (i * 7) % 24, 1, 1, "#fff");
    r(wx + 21, 10, 2, 30, "#3a2a1a"); r(wx + 2, 24, 40, 2, "#3a2a1a");
  });
  r(222, 14, 6, 6, "#f6f1c8");
  r(8, 6, 40, 56, "#22252f"); r(10, 8, 36, 52, "#2d3140");
  for (let i = 0; i < 6; i++) { r(13, 11 + i * 8, 30, 6, "#1a1c24"); r(16, 13 + i * 8, 2, 2, (Math.floor(t / (HEAVY ? 120 : 250) + i) % 3) ? "#3cff7a" : "#ff5a5a"); r(20, 13 + i * 8, 2, 2, (Math.floor(t / 400 + i * 2) % 2) ? "#3cf0ff" : "#1a1c24"); }
  r(250, 22, 62, 40, "#2a3350"); r(254, 26, 54, 24, "#141830"); r(258, 30, 46, 16, VZ ? "#ffb35c" : (Math.sin(t / 500) > 0 ? "#7be08a" : "#58c06a"));
  r(262, 34, 8, 8, "#fff"); r(274, 36, 10, 6, "#fff8"); r(288, 34, 12, 8, "#fff");
  const plant = (x, y) => { r(x, y + 14, 12, 12, "#a0522d"); r(x - 2, y, 6, 14, "#3f9b4a"); r(x + 4, y - 6, 6, 20, "#58b860"); r(x + 9, y + 2, 5, 12, "#3f9b4a"); };
  plant(4, 76); plant(302, 76);
  r(0, 458, CW, 62, "#9c7a50"); r(0, 456, CW, 3, "#6b4226");
  r(16, 470, 70, 30, "#6b4226"); r(16, 466, 70, 6, "#8b5a34");
  r(24, 448, 22, 20, "#2a2a2a"); r(28, 452, 14, 8, "#c0392b"); r(30, 462, 10, 4, "#f4efe3");
  for (let i = 0; i < 2; i++) { const ph = (t / 1300 + i / 2) % 1; g.globalAlpha = 0.6 * (1 - ph); r(33 + i * 4 + Math.sin(t / 300 + i) * 2, 444 - ph * 14, 2, 3, "#fff"); }
  g.globalAlpha = 1;
  r(56, 458, 8, 9, "#f4efe3"); r(68, 458, 8, 9, "#6fc3ff");
  r(120, 476, 80, 24, "#4b5e9a"); r(116, 470, 10, 30, "#3d4e86"); r(194, 470, 10, 30, "#3d4e86"); r(124, 470, 72, 10, "#5a6fb0");
  plant(220, 474);
  r(266, 440, 40, 72, "#6b4226"); r(270, 444, 32, 68, "#8b5a34"); r(296, 476, 3, 3, "#ffd84a");
  g.fillStyle = "#ffe9a010"; [80, 240].forEach((x) => { g.beginPath(); g.arc(x, 200, 90, 0, 7); g.fill(); g.beginPath(); g.arc(x, 380, 90, 0, 7); g.fill(); });
}
function drawBot(g, b, skin, t, ox, oy) {
  const L = LOOK[b.id];
  const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x + ox - 10), Math.round(y + oy - 26), w, h); };
  const lv = b.level;
  const lean = lv === "santai" ? -3 : 0;
  r(46 + lean, 48, 28, 26, "#3a3f5c");
  const bob = lv === "ngebut" ? Math.round(Math.sin(t / 60)) : lv === "sibuk" ? Math.round(Math.sin(t / 160)) : 0;
  const sleep = lv === "tidur";
  const breathe = sleep ? Math.round(Math.sin(t / 700)) : 0;
  const hx = 50 + lean, hy = sleep ? 56 + breathe : 34 + bob + (lv === "santai" ? -1 : 0);
  const ghost = skin === "hantu";
  const float = ghost && !sleep ? Math.round(Math.sin(t / 400) * 2) : 0;
  const bodyC = skin === "robot" ? "#9aa4b8" : ghost ? "#eef0ff" : skin === "kucing" ? L.fur : L.shirt;
  r(48 + lean, 58 + float + (sleep ? 4 : 0), 24, 18, bodyC);
  if (skin === "manusia" || skin === "kucing") r(58 + lean, 58 + float, 4, 6, "#ffffff55");
  if (skin === "robot") { r(54 + lean, 62 + float, 12, 6, "#2a2f40"); r(56 + lean, 64, 2, 2, Math.sin(t / 200) > 0 ? "#3cff7a" : "#ff5a5a"); }
  const head = skin === "robot" ? "#b8c2d6" : ghost ? "#ffffff" : skin === "kucing" ? L.fur : L.skin;
  r(hx, hy + float, 20, 18, head);
  if (skin === "manusia") { r(hx, hy + float - 2, 20, 5, L.hair); r(hx - 1, hy + float, 2, 8, L.hair); r(hx + 19, hy + float, 2, 8, L.hair); }
  if (skin === "kucing") { r(hx, hy + float - 4, 5, 5, L.fur); r(hx + 15, hy + float - 4, 5, 5, L.fur); r(hx + 1, hy + float - 3, 3, 3, "#f7a8b8"); r(hx + 16, hy + float - 3, 3, 3, "#f7a8b8"); r(hx - 3, hy + float + 11, 4, 1, "#333"); r(hx + 19, hy + float + 11, 4, 1, "#333"); }
  if (skin === "robot") { r(hx + 9, hy + float - 5, 2, 5, "#7a8499"); r(hx + 8, hy + float - 7, 4, 3, Math.sin(t / 150) > 0 ? "#ff5a5a" : "#ffd84a"); r(hx - 2, hy + float + 6, 2, 6, "#7a8499"); r(hx + 20, hy + float + 6, 2, 6, "#7a8499"); }
  if (ghost) { for (let i = 0; i < 4; i++) r(48 + lean + i * 6, 76 + float + (sleep ? 4 : 0), 3, 2 + ((i + Math.floor(t / 300)) % 2), "#eef0ff"); }
  const ey = hy + float + 8;
  const blink = Math.sin(t / 900 + hx) > 0.95;
  const eyeC = skin === "robot" ? "#3cf0ff" : "#1a1a1a";
  if (sleep || blink || lv === "santai" && Math.sin(t / 1200) > 0.6) { r(hx + 4, ey + 1, 4, 1, eyeC); r(hx + 12, ey + 1, 4, 1, eyeC); }
  else { r(hx + 5, ey, 3, 3, eyeC); r(hx + 12, ey, 3, 3, eyeC); }
  if (!sleep) r(hx + 8, ey + 6, 4, 1, skin === "robot" ? "#3cf0ff" : "#8a4a3a");
  if (skin !== "robot" && !ghost) { r(hx + 2, ey + 4, 3, 2, "#f59a9a88"); r(hx + 15, ey + 4, 3, 2, "#f59a9a88"); }
  const ax = hx, ay = hy + float;
  if (L.acc === "beret") r(ax - 1, ay - 4, 18, 4, "#c0392b");
  if (L.acc === "cap") { r(ax, ay - 4, 20, 5, "#d94040"); r(ax + 14, ay, 10, 2, "#a02020"); }
  if (L.acc === "beanie") { r(ax, ay - 5, 20, 6, "#2b6cb0"); r(ax + 8, ay - 8, 4, 3, "#fff"); }
  if (L.acc === "phones") { r(ax - 3, ay + 5, 4, 8, "#222"); r(ax + 19, ay + 5, 4, 8, "#222"); r(ax, ay - 3, 20, 2, "#222"); }
  if (L.acc === "glasses") { r(ax + 3, ey - 1, 6, 5, "#000a"); r(ax + 11, ey - 1, 6, 5, "#000a"); r(ax + 9, ey, 2, 1, "#000"); }
  if (L.acc === "clap") { r(ax + 2, ay - 6, 16, 5, "#222"); for (let i = 0; i < 4; i++) r(ax + 3 + i * 4, ay - 6, 2, 2, "#fff"); }
  if (L.acc === "tie" && !sleep) { r(58 + lean, 60 + float, 4, 10, "#c0392b"); r(ax + 7, ay - 6, 6, 4, "#ffd84a"); }
  if (L.acc === "camera" && !sleep) { r(52 + lean, 66 + float, 10, 7, "#222"); r(55 + lean, 68 + float, 4, 3, "#8fd3ff"); }
  r(30, 74, 110, 6, b.id === "sup" ? "#6b3a2a" : "#8b5a34"); r(30, 80, 110, 3, "#6b4226"); r(34, 83, 6, 18, "#6b4226"); r(130, 83, 6, 18, "#6b4226");
  r(88, 44, 42, 28, "#1d1f2a"); r(105, 72, 8, 3, "#1d1f2a");
  const scr = sleep ? "#141830" : lv === "santai" ? "#3a4a7a" : (Math.sin(t / (lv === "ngebut" ? 90 : 220)) > -0.6 ? L.shirt : "#ffffff");
  r(91, 47, 36, 22, scr);
  if (!sleep) for (let i = 0; i < 4; i++) r(93, 49 + i * 5, lv === "santai" ? 20 : ((t / (lv === "ngebut" ? 25 : 60) + i * 7) % 30) + 3, 2, "#00000055");
  if (sleep) r(126, 66, 1, 1, Math.sin(t / 500) > 0 ? "#3cff7a" : "#141830");
  r(56, 71, 28, 3, "#d8d8e0");
  const skinArm = skin === "robot" ? "#7a8499" : ghost ? "#eef0ff" : skin === "kucing" ? L.fur : L.skin;
  if (sleep) {
    r(44, 70, 34, 5, bodyC);
    g.fillStyle = "#e6ebff"; g.font = "bold 12px monospace";
    for (let i = 0; i < 3; i++) { const ph = (t / 1600 + i / 3) % 1; g.globalAlpha = 1 - ph; g.fillText(i === 2 ? "Z" : "z", ox + 64 + ph * 14 + i * 3, oy + 30 - ph * 26); }
    g.globalAlpha = 1;
  } else if (lv === "santai") {
    const sip = Math.sin(t / 1400) > 0.3;
    r(44 + lean, 64, 5, 10, skinArm);
    const mx = sip ? hx + 14 : 70, my = sip ? hy + 12 : 66;
    r(mx, my, 7, 8, "#f4efe3"); r(mx + 7, my + 2, 2, 4, "#f4efe3"); r(mx + 1, my + 1, 5, 2, "#6b3a1e");
    for (let i = 0; i < 2; i++) { const ph = (t / 1200 + i / 2) % 1; g.globalAlpha = 0.7 * (1 - ph); r(mx + 2 + i * 2 + Math.sin(t / 300 + i) * 2, my - 3 - ph * 12, 2, 3, "#ffffff"); }
    g.globalAlpha = 1;
  } else {
    const a = Math.sin(t / (lv === "ngebut" ? 35 : 90)) > 0 ? 1 : 0;
    r(54, 68 - a, 6, 5, skinArm); r(72, 68 - (1 - a), 6, 5, skinArm);
    r(32, 66, 7, 8, "#f4efe3"); r(33, 67, 5, 2, "#6b3a1e");
    if (lv === "ngebut") {
      for (let i = 0; i < 5; i++) { const ph = (t / 350 + i / 5) % 1; g.globalAlpha = 1 - ph; r(70 + Math.sin(i * 9) * 14 + ph * 10 * Math.cos(i), 66 - ph * 18, 2, 2, i % 2 ? "#ffe066" : "#ff9a3d"); }
      for (let i = 0; i < 3; i++) { const ph = (t / 700 + i / 3) % 1; g.globalAlpha = 0.5 * (1 - ph); r(hx + 2 + i * 7 + Math.sin(t / 200 + i) * 2, hy - 8 - ph * 16, 4, 4, "#ffffff"); }
      g.globalAlpha = 1;
    } else { const ph = (t / 1000) % 1; g.globalAlpha = 0.6 * (1 - ph); r(34 + Math.sin(t / 300) * 2, 62 - ph * 10, 2, 3, "#fff"); g.globalAlpha = 1; }
  }
}

const SKINS=["manusia","robot","kucing","hantu"];let skin=localStorage.getItem("kantor-skin")||"manusia",BOTS=[],sel="";
const c=document.getElementById("c"),g=c.getContext("2d"),wrap=document.getElementById("wrap");
function skins(){const s=document.getElementById("sk");s.innerHTML="";SKINS.forEach(k=>{const b=document.createElement("button");b.textContent=k[0].toUpperCase()+k.slice(1);if(k==skin)b.className="on";b.onclick=()=>{skin=k;localStorage.setItem("kantor-skin",k);skins()};s.appendChild(b)})}
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function render(){wrap.querySelectorAll(".tag,.hit").forEach(e=>e.remove());BOTS.forEach((b,i)=>{if(!LOOK[b.id])return;const[ox,oy]=cellOf(i),lv=LV[b.level]||LV.tidur;
const h=document.createElement("div");h.className="hit";h.style.cssText=`left:${ox/CW*100}%;top:${(oy+4)/CH*100}%;height:${80/CH*100}%`;h.onclick=()=>{sel=sel==b.id?"":b.id;render()};wrap.appendChild(h);
const t=document.createElement("div");t.className="tag"+(sel==b.id?" on":"");t.style.cssText=`left:${(ox+60)/CW*100}%;top:${(oy+2)/CH*100}%;border-left-color:${lv.dot}`;t.innerHTML=`<div class="n">${esc(b.name)}</div><div class="s">${lv.label} · ${esc(b.line)}</div>`;t.onclick=h.onclick;wrap.appendChild(t)});
const b=BOTS.find(x=>x.id==sel),d=document.getElementById("det");d.style.display=b?"block":"none";if(b)d.innerHTML=`<div class="n">${esc(b.name)} · ${LV[b.level].label}</div>Kerjaan: ${esc(b.job)}<br>Lagi ngapain: ${esc(b.task)}<br>Terakhir aktif: ${esc(b.last)} WIB (${b.mins} menit lalu)<br><small>Bukti: ${esc(b.evidence)}</small>`;
document.getElementById("tb").innerHTML=BOTS.map(x=>`<tr><td>${esc(x.name)}</td><td>${(LV[x.level]||LV.tidur).label}</td><td>${esc(x.line)}</td></tr>`).join("")}
function loop(t){g.imageSmoothingEnabled=false;drawBg(g,t);BOTS.forEach((b,i)=>{if(LOOK[b.id]){const[ox,oy]=cellOf(i);drawBot(g,b,skin,t,ox,oy)}});requestAnimationFrame(loop)}
async function load(){try{let d;try{const r=await fetch("https://raw.githubusercontent.com/rarecamvideo-gif/kantor-bot/data/status.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;d=await r.json()}catch(e){d=await(await fetch("status.json?t="+Date.now(),{cache:"no-store"})).json()}BOTS=d.bots;HEAVY=!!(d.locks&&d.locks.heavy_cpu);VZ=d.locks&&d.locks.vectorizer;const n=l=>BOTS.filter(b=>b.level==l).length;document.getElementById("st").textContent=`Status per ${d.updated.slice(0,5)} WIB · ${n("ngebut")} ngebut, ${n("sibuk")} sibuk, ${n("santai")} santai, ${n("tidur")} tidur`;render()}catch(e){document.getElementById("st").textContent="Gagal ambil status, nyoba lagi…"}}
skins();load();setInterval(load,45000);requestAnimationFrame(loop);
</script></body></html>
